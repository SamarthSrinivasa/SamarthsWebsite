<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Samarth</title>
<meta name="description" content="Samarth — random stuff." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<script>
  // Set theme before paint to avoid flash of wrong theme
  (function () {
    var stored = localStorage.getItem('theme');
    var mode = stored || 'system';
    var resolved = mode === 'system'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : mode;
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.setAttribute('data-theme-pref', mode);
  })();
</script>
</head>
<body>

  <header class="topbar">
    <nav class="nav" aria-label="Primary">
      <a href="#home" class="nav-link" data-route="home">Home</a>
      <a href="#about" class="nav-link" data-route="about">About</a>
      <a href="#projects" class="nav-link" data-route="projects">Projects</a>
    </nav>

    <div class="theme-toggle" role="group" aria-label="Theme">
      <button class="theme-btn" data-mode="light" aria-label="Light mode" title="Light">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.6" y2="4.4"/></g></svg>
      </button>
      <button class="theme-btn" data-mode="dark" aria-label="Dark mode" title="Dark">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M20.7 14.9A8.6 8.6 0 0 1 9.1 3.3a.7.7 0 0 0-.9-.9 9.9 9.9 0 1 0 13.4 13.4.7.7 0 0 0-.9-.9Z"/></svg>
      </button>
      <button class="theme-btn" data-mode="system" aria-label="System preference" title="System">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="8" y1="20" x2="16" y2="20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="12" y1="16.5" x2="12" y2="20" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <span class="theme-indicator" aria-hidden="true"></span>
    </div>
  </header>

  <main>
    <section id="view-home" class="view">
      <div class="hero">
        <h1 class="name">Samarth</h1>
        <p class="tagline">random stuff</p>
      </div>
    </section>

    <section id="view-about" class="view">
      <div class="page-content">
        <h2 class="section-title">About</h2>
        <p class="body-text">Random stuff.</p>
      </div>
    </section>

    <section id="view-projects" class="view">
      <div class="page-content">
        <h2 class="section-title">Projects</h2>
        <ul class="project-list">
          <li class="project-item project-item--empty">
            <span class="project-name">Nothing here yet</span>
            <span class="project-desc">Check back soon.</span>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
